<!DOCTYPE html>
<html>

<head>

<title>StudentHub Portal - Feedback</title>

<link rel="stylesheet" href="style.css">

<style>

.feedback-box{
    width:700px;
    margin:40px auto;
    background:#dbdbd6b3;
    padding:25px;
    border:1px solid gray;
    border-radius:8px;
}

.feedback-title{
    width:250px;
    margin:0 auto 30px;
    text-align:center;
    padding:10px;
    border:2px solid black;
    border-radius:8px;
    font-size:22px;
    font-weight:bold;
    background:white;
}

table{
    width:100%;
}

td{
    padding:10px;
}

.label{
    width:220px;
    text-align:center;
    font-weight:bold;
    border:2px solid black;
    border-radius:8px;
    padding:10px;
    background:white;
}

input[type=text],
input[type=email]{
    width:300px;
    padding:10px;
    border:1px solid gray;
    border-radius:8px;
    font-size:15px;
}

textarea{
    width:300px;
    height:90px;
    padding:10px;
    border:1px solid gray;
    border-radius:8px;
    resize:none;
    font-size:15px;
}

.rating{
    font-size:14px;
}

.button{
    text-align:center;
    margin-top:20px;
}

.button input{
    width:120px;
    padding:10px;
    margin:10px;
    background:#184a55;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.button input:hover{
    background:#123640;
}

</style>

</head>

<body>

<header>
    <div class="header-content">

        <div class="header-text">
            <h1>StudentHub Portal</h1>
            
        </div>

        <div class="profile">

    <a href="profile.html" title="View Profile">

        <svg xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 16 16">

            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>

            <path fill-rule="evenodd"
                  d="M8 9a5 5 0 0 0-5 5 .5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5 5 5 0 0 0-5-5z"/>

        </svg>

    </a>

</div>

    </div>

</header>

<nav>

<a href="home.html">Home</a>

<a href="dashboard.html">Dashboard</a>

<a href="events.html">Events</a>

<a href="contact.html">Contact</a>

<a href="about.html">About Us</a>

</nav>

<div class="feedback-box">

<div class="feedback-title">

Feedback Form

</div>

<form>

<table>

<tr>

<td class="label">Full Name</td>

<td>

<input
type="text"
placeholder="Enter Full Name"
required
oninvalid="this.setCustomValidity('Please enter your Full Name')"
oninput="this.setCustomValidity('')">

</td>

</tr>

<tr>

<td class="label">Enrollment Number</td>

<td>

<input
type="text"
placeholder="Enter Enrollment Number"
required
oninvalid="this.setCustomValidity('Please enter your Enrollment Number')"
oninput="this.setCustomValidity('')">

</td>

</tr>

<tr>

<td class="label">Department</td>

<td>

<input
type="text"
placeholder="Enter Department"
required
oninvalid="this.setCustomValidity('Please enter your Department')"
oninput="this.setCustomValidity('')">

</td>

</tr>

<tr>

<td class="label">Email</td>

<td>

<input
type="email"
placeholder="Enter Email"
required
oninvalid="this.setCustomValidity('Please enter your Email')"
oninput="this.setCustomValidity('')">

</td>

</tr>

<tr>

<td class="label">Rating</td>

<td class="rating">

<input type="radio" name="rate" required> Excellent

&nbsp;&nbsp;

<input type="radio" name="rate"> Good

&nbsp;&nbsp;

<input type="radio" name="rate"> Average

&nbsp;&nbsp;

<input type="radio" name="rate"> Poor

</td>

</tr>

<tr>

<td class="label">Feedback</td>

<td>

<textarea
placeholder="Write your feedback..."
required
oninvalid="this.setCustomValidity('Please enter your Feedback')"
oninput="this.setCustomValidity('')"></textarea>

</td>

</tr>

</table>

<div class="button">

<input type="submit" value="Submit">

<input type="reset" value="Reset">

</div>

</form>

</div>

<footer>

<p><b>StudentHub Portal</b></p>

<p>Email : studenthub@gmail.com</p>

<p>Phone : +91 9876543210</p>

<p>© 2026 StudentHub Portal</p>

</footer>

</body>

</html>
