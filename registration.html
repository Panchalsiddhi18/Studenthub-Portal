<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudentHub Portal - Registration</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Your CSS -->

    <link rel="stylesheet"
          href="style.css">


    <style>

        /* Registration Box */

        .registration-box {

            width: 650px;

            max-width: 90%;

            margin: 40px auto;

            background-color: #e1e1da;

            border: 1px solid #011935;

            border-radius: 10px;

            padding: 30px;

            box-sizing: border-box;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.10);

        }


        /* Title */

        .registration-title {

            text-align: center;

            color: #011935;

            margin-bottom: 25px;

        }


        .registration-title h2 {

            margin: 0;

            font-size: 28px;

        }


        /* Form */

        .registration-form {

            width: 100%;

        }


        .form-group {

            margin-bottom: 18px;

        }


        .form-group label {

            display: block;

            color: #011935;

            font-weight: 600;

            margin-bottom: 7px;

        }


        /* Inputs */

        .registration-input {

            width: 100%;

            padding: 11px;

            border: 1px solid #999;

            border-radius: 8px;

            font-size: 15px;

            font-family: 'Poppins', sans-serif;

            outline: none;

            box-sizing: border-box;

            background-color: white;

        }


        .registration-input:focus {

            border: 2px solid #2c5aa0;

        }


        /* Gender */

        .gender {

            color: #011935;

            font-size: 15px;

        }


        .gender input {

            margin-right: 5px;

        }


        /* Terms */

        .terms {

            margin-top: 15px;

            color: #011935;

            font-size: 14px;

        }


        .terms input {

            margin-right: 7px;

        }


        .terms a {

            color: #2c5aa0;

            text-decoration: none;

            font-weight: 600;

        }


        .terms a:hover {

            text-decoration: underline;

            color: #011935;

        }


        /* Register Button */

        .register-button {

            width: 100%;

            padding: 11px;

            background-color: #011935;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

            font-family: 'Poppins', sans-serif;

            font-weight: 600;

            margin-top: 20px;

        }


        .register-button:hover {

            background-color: #2c5aa0;

        }


        /* Login Link */

        .login-link {

            text-align: center;

            margin-top: 20px;

        }


        .login-link a {

            color: #2c5aa0;

            text-decoration: none;

            font-weight: 600;

        }


        .login-link a:hover {

            color: #011935;

            text-decoration: underline;

        }


        /* Mobile */

        @media (max-width: 600px) {

            .registration-box {

                width: 95%;

                max-width: 95%;

                padding: 22px;

            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="header-content">


        <div class="header-text">

            <h1>StudentHub Portal</h1>

        </div>


        <!-- Profile Logo -->

        <div class="profile">

            <a href="profile.html"
               title="View Profile">

                <svg xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 16 16">

                    <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>

                    <path fill-rule="evenodd"
                          d="M8 9a5 5 0 0 0-5 5 .5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5 5 5 0 0 0-5-5z"/>

                </svg>

            </a>

        </div>

    </div>

</header>


<!-- ================= NAVIGATION ================= -->

<nav>

    <a href="home.html">Home</a>

    <a href="login.html">Login</a>

    <a href="about.html">About Us</a>

    <a href="contact.html">Contact</a>

</nav>


<!-- ================= REGISTRATION ================= -->

<div class="registration-box">


    <div class="registration-title">

        <h2>📝 Student Registration</h2>

    </div>


    <form
        class="registration-form"
        onsubmit="registerStudent(event)">


        <!-- Full Name -->

        <div class="form-group">

            <label for="name">
                Full Name :
            </label>

            <input
                type="text"
                id="name"
                class="registration-input"
                placeholder="Enter Full Name"
                required
                oninvalid="this.setCustomValidity('Please enter your Full Name')"
                oninput="this.setCustomValidity('')">

        </div>


        <!-- Email -->

        <div class="form-group">

            <label for="email">
                Email :
            </label>

            <input
                type="email"
                id="email"
                class="registration-input"
                placeholder="Enter Email Address"
                required
                oninvalid="this.setCustomValidity('Please enter your Email Address')"
                oninput="this.setCustomValidity('')">

        </div>


        <!-- Mobile -->

        <div class="form-group">

            <label for="mobile">
                Mobile Number :
            </label>

            <input
                type="text"
                id="mobile"
                class="registration-input"
                placeholder="Enter 10-digit Mobile Number"
                pattern="[0-9]{10}"
                required
                oninvalid="this.setCustomValidity('Please enter a valid 10-digit Mobile Number')"
                oninput="this.setCustomValidity('')">

        </div>


        <!-- Password -->

        <div class="form-group">

            <label for="password">
                Password :
            </label>

            <input
                type="password"
                id="password"
                class="registration-input"
                placeholder="Enter Password"
                required
                oninvalid="this.setCustomValidity('Please enter your Password')"
                oninput="this.setCustomValidity('')">

        </div>


        <!-- Confirm Password -->

        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password :
            </label>

            <input
                type="password"
                id="confirmPassword"
                class="registration-input"
                placeholder="Confirm Password"
                required>

        </div>


        <!-- Gender -->

        <div class="form-group">

            <label>
                Gender :
            </label>

            <div class="gender">

                <input
                    type="radio"
                    name="gender"
                    value="Male"
                    required>

                Male

                &nbsp;&nbsp;&nbsp;

                <input
                    type="radio"
                    name="gender"
                    value="Female">

                Female

                &nbsp;&nbsp;&nbsp;

                <input
                    type="radio"
                    name="gender"
                    value="Other">

                Other

            </div>

        </div>


        <!-- Terms -->

        <div class="terms">

            <input
                type="checkbox"
                id="terms"
                required>

            I agree to the

            <a href="#">
                Terms & Conditions
            </a>

        </div>


        <!-- Register Button -->

        <button
            type="submit"
            class="register-button">

            Register

        </button>


    </form>


    <!-- Login Link -->

    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login Here
        </a>

    </div>


</div>


<!-- ================= FOOTER ================= -->

<footer>

    <p>
        <b>StudentHub Portal</b>
    </p>

    <p>
        Email : studenthub@gmail.com
    </p>

    <p>
        Phone : +91 9876543210
    </p>

    <p>
        © 2026 StudentHub Portal
    </p>

</footer>


<!-- ================= JAVASCRIPT ================= -->

<script>

function registerStudent(event) {

    event.preventDefault();


    var password =
        document.getElementById("password").value;

    var confirmPassword =
        document.getElementById("confirmPassword").value;


    if (password !== confirmPassword) {

        alert("Password and Confirm Password do not match.");

        return;

    }


    alert("Registration successful!");


    window.location.href =
        "login.html";

}

</script>


</body>

</html>
