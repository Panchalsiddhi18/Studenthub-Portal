
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Portal - Registration</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Existing CSS -->
    <link rel="stylesheet" href="style.css">

    <style>
        .registration-box {
            width: 100%;
            max-width: 650px;
            margin: 30px auto;
            background-color: #e1e1da;
            border: 1px solid #011935;
            border-radius: 10px;
            padding: 22px;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.10);
        }

        .registration-title {
            text-align: center;
            color: #011935;
            margin-bottom: 25px;
        }

        .registration-title h2 {
            margin: 0;
            font-size: 25px;
        }

        .registration-form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #011935;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .registration-input {
            width: 100%;
            padding: 11px;
            border: 1px solid #999;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            outline: none;
            box-sizing: border-box;
            background-color: white;
        }

        .registration-input:focus {
            border: 2px solid #2c5aa0;
        }

        .gender {
            color: #011935;
            font-size: 15px;
        }

        .gender input {
            margin-right: 5px;
        }

        .terms {
            margin-top: 15px;
            color: #011935;
            font-size: 14px;
        }

        .terms input {
            margin-right: 7px;
        }

        .terms a {
            color: #2c5aa0;
            text-decoration: none;
            font-weight: 600;
        }

        .terms a:hover {
            text-decoration: underline;
            color: #011935;
        }

        .register-button {
            width: 100%;
            padding: 11px;
            background-color: #011935;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            margin-top: 20px;
        }

        .register-button:hover {
            background-color: #2c5aa0;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #2c5aa0;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            color: #011935;
            text-decoration: underline;
        }

        @media (min-width: 601px) {
            .registration-box {
                padding: 30px;
            }

            .registration-title h2 {
                font-size: 28px;
            }
        }

        @media (max-width: 400px) {
            .registration-box {
                padding: 18px;
                margin: 20px auto;
            }

            .registration-title h2 {
                font-size: 22px;
            }

            .gender {
                line-height: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="header-content">
            <div class="header-text">
                <h1>StudentHub Portal</h1>
            </div>

            <div class="profile">
                <a href="profile.html" title="View Profile">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                        <path fill-rule="evenodd" d="M8 9a5 5 0 0 0-5 5 .5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5 5 5 0 0 0-5-5z"/>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <!-- Registration -->
    <div class="registration-box">

        <div class="registration-title">
            <h2>📝 Student Registration</h2>
        </div>

        <form class="registration-form"
              id="registrationForm"
              action="process_registration.php"
              method="POST">

            <!-- Full Name -->
            <div class="form-group">
                <label for="name">Full Name :</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    class="registration-input"
                    placeholder="Enter Full Name"
                    autocomplete="name"
                    required>
            </div>

            <!-- Enrollment ID -->
            <div class="form-group">
                <label for="Id">Enrollment Id :</label>
                <input
                    type="text"
                    id="Id"
                    name="enrollment"
                    class="registration-input"
                    placeholder="Enter Enrollment Id"
                    autocomplete="off"
                    required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email :</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="registration-input"
                    placeholder="Enter Email Address"
                    autocomplete="email"
                    required>
            </div>

            <!-- Mobile -->
            <div class="form-group">
                <label for="mobile">Mobile Number :</label>
                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    class="registration-input"
                    placeholder="Enter 10-digit Mobile Number"
                    maxlength="10"
                    minlength="10"
                    pattern="[6-9][0-9]{9}"
                    autocomplete="tel"
                    required>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password :</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="registration-input"
                    placeholder="Enter Password"
                    minlength="8"
                    autocomplete="new-password"
                    required>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password :</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    class="registration-input"
                    placeholder="Confirm Password"
                    minlength="8"
                    autocomplete="new-password"
                    required>
            </div>

            <!-- Course -->
            <div class="form-group">
                <label for="course">Course :</label>
                <select
                    id="course"
                    name="course"
                    class="registration-input"
                    required>

                    <option value="">Select Course</option>
                    <option value="Computer Engineering">Computer Engineering</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Electronics Engineering">Electronics Engineering</option>
                </select>
            </div>

            <!-- Year -->
            <div class="form-group">
                <label for="year">Year :</label>
                <select
                    id="year"
                    name="year"
                    class="registration-input"
                    required>

                    <option value="">Select Year</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label>Gender :</label>

                <div class="gender">
                    <input type="radio" id="genderMale" name="gender" value="Male" required>
                    <label for="genderMale" style="display:inline;">Male</label>

                    &nbsp;&nbsp;&nbsp;

                    <input type="radio" id="genderFemale" name="gender" value="Female">
                    <label for="genderFemale" style="display:inline;">Female</label>

                    &nbsp;&nbsp;&nbsp;

                    <input type="radio" id="genderOther" name="gender" value="Other">
                    <label for="genderOther" style="display:inline;">Other</label>
                </div>
            </div>

            <!-- Terms -->
            <div class="terms">
                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    value="accepted"
                    required>

                <label for="terms" style="display:inline;">
                    I agree to the
                </label>

                <a href="#">Terms &amp; Conditions</a>
            </div>

            <!-- Register Button -->
            <button type="submit" class="register-button">
                Register
            </button>

        </form>

        <!-- Login Link -->
        <div class="login-link">
            Already have an account?
            <a href="login.html">Login Here</a>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p><b>StudentHub Portal</b></p>
        <p>Email : studenthub@gmail.com</p>
        <p>Phone : +91 9876543210</p>
        <p>© 2026 StudentHub Portal</p>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
