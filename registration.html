
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Portal - Registration</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .registration-box {
            width: 100%;
            max-width: 650px;
            margin: 30px auto;
            background-color: #e1e1da;
            border: 1px solid #011935;
            border-radius: 10px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.10);
        }

        .registration-title {
            text-align: center;
            color: #011935;
            margin-bottom: 25px;
        }

        .registration-title h2 {
            margin: 0;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #011935;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .registration-input {
            width: 100%;
            padding: 11px;
            border: 1px solid #999;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            outline: none;
            box-sizing: border-box;
            background-color: white;
        }

        .registration-input:focus {
            border: 2px solid #2c5aa0;
        }

        .gender {
            color: #011935;
            font-size: 15px;
        }

        .gender input {
            margin-right: 5px;
        }

        .terms {
            margin-top: 15px;
            color: #011935;
            font-size: 14px;
        }

        .terms input {
            margin-right: 7px;
        }

        .terms a {
            color: #2c5aa0;
            text-decoration: none;
            font-weight: 600;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .register-button {
            width: 100%;
            padding: 11px;
            background-color: #011935;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            margin-top: 20px;
        }

        .register-button:hover {
            background-color: #2c5aa0;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #2c5aa0;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            color: #011935;
            text-decoration: underline;
        }

        @media (max-width: 650px) {
            .registration-box {
                width: calc(100% - 24px);
                padding: 20px;
                margin: 20px auto;
            }

            .registration-title h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-content">
        <div class="header-text">
            <h1>StudentHub Portal</h1>
        </div>

        <div class="profile">
            <a href="profile.html" title="View Profile">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                    <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                    <path fill-rule="evenodd"
                          d="M8 9a5 5 0 0 0-5 5 .5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5 5 5 0 0 0-5-5z"/>
                </svg>
            </a>
        </div>
    </div>
</header>

<div class="registration-box">

    <div class="registration-title">
        <h2>📝 Student Registration</h2>
    </div>

    <form class="registration-form"
          id="registrationForm"
          action="process_registration.php"
          method="POST">

        <div class="form-group">
            <label for="name">Full Name:</label>
            <input type="text"
                   id="name"
                   name="name"
                   class="registration-input"
                   placeholder="Enter Full Name"
                   autocomplete="name"
                   minlength="2"
                   maxlength="50"
                   pattern="[A-Za-z ]{2,50}"
                   required>
        </div>

        <div class="form-group">
            <label for="Id">Enrollment ID:</label>
            <input type="text"
                   id="Id"
                   name="enrollment"
                   class="registration-input"
                   placeholder="Enter Enrollment ID"
                   autocomplete="off"
                   minlength="5"
                   maxlength="20"
                   required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email"
                   id="email"
                   name="email"
                   class="registration-input"
                   placeholder="Enter Email Address"
                   autocomplete="email"
                   required>
        </div>

        <div class="form-group">
            <label for="mobile">Mobile Number:</label>
            <input type="tel"
                   id="mobile"
                   name="mobile"
                   class="registration-input"
                   placeholder="Enter 10-digit Mobile Number"
                   minlength="10"
                   maxlength="10"
                   pattern="[6-9][0-9]{9}"
                   autocomplete="tel"
                   required>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password"
                   id="password"
                   name="password"
                   class="registration-input"
                   placeholder="Enter Password"
                   minlength="8"
                   autocomplete="new-password"
                   required>
            <small>Use at least 8 characters, including uppercase, lowercase and a number.</small>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password"
                   id="confirmPassword"
                   name="confirmPassword"
                   class="registration-input"
                   placeholder="Confirm Password"
                   minlength="8"
                   autocomplete="new-password"
                   required>
        </div>

        <div class="form-group">
            <label for="course">Course:</label>
            <select id="course"
                    name="course"
                    class="registration-input"
                    required>
                <option value="">Select Course</option>
                <option value="Computer Engineering">Computer Engineering</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Electronics Engineering">Electronics Engineering</option>
            </select>
        </div>

        <div class="form-group">
            <label for="year">Year:</label>
            <select id="year"
                    name="year"
                    class="registration-input"
                    required>
                <option value="">Select Year</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
            </select>
        </div>

        <div class="form-group">
            <label for="semester">Semester:</label>
            <select id="semester"
                    name="semester"
                    class="registration-input"
                    required>
                <option value="">Select Year First</option>
            </select>
        </div>

        <div class="form-group">
            <label>Gender:</label>
            <div class="gender">
                <label style="display:inline;font-weight:normal;">
                    <input type="radio" name="gender" value="Male" required>
                    Male
                </label>

                &nbsp;&nbsp;

                <label style="display:inline;font-weight:normal;">
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>

                &nbsp;&nbsp;

                <label style="display:inline;font-weight:normal;">
                    <input type="radio" name="gender" value="Other">
                    Other
                </label>
            </div>
        </div>

        <div class="terms">
            <label style="display:inline;font-weight:normal;">
                <input type="checkbox"
                       id="terms"
                       name="terms"
                       value="accepted"
                       required>
                I agree to the
                <a href="#">Terms &amp; Conditions</a>
            </label>
        </div>

        <button type="submit" class="register-button">
            Register
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login Here</a>
    </div>

</div>

<footer>
    <p><b>StudentHub Portal</b></p>
    <p>Email: studenthub@gmail.com</p>
    <p>Phone: +91 9876543210</p>
    <p>© 2026 StudentHub Portal</p>
</footer>

<script>
    const yearSelect = document.getElementById("year");
    const semesterSelect = document.getElementById("semester");

    const semesterOptions = {
        "1st Year": ["1", "2"],
        "2nd Year": ["3", "4"],
        "3rd Year": ["5", "6"],
        "4th Year": ["7", "8"]
    };

    yearSelect.addEventListener("change", function () {
        semesterSelect.innerHTML =
            '<option value="">Select Semester</option>';

        const semesters = semesterOptions[this.value] || [];

        semesters.forEach(function (semester) {
            const option = document.createElement("option");
            option.value = semester;
            option.textContent = "Semester " + semester;
            semesterSelect.appendChild(option);
        });
    });

    document.getElementById("registrationForm").addEventListener("submit", function (event) {
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            event.preventDefault();
            alert("Password and Confirm Password do not match.");
        }
    });
</script>

</body>
</html>
