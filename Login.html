<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudentHub Portal - Login</title>


    <!-- ================= GOOGLE FONT ================= -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {
            font-family: 'Poppins', sans-serif;
            background-color: #e1e1da;
            overflow: hidden;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .login-header {

            width: 100%;

            height: 130px;

            background-color: #011935;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .login-header h1 {

            color: #e1e1da;

            font-size: 42px;

            font-weight: 700;

            margin: 0;

            letter-spacing: 0.5px;

        }


        /* =====================================================
           MAIN IMAGE AREA
        ===================================================== */

        .login-main {

            position: relative;

            width: 100%;

            height: calc(100vh - 90px);

            overflow: hidden;

        }


        /* =====================================================
           BACKGROUND IMAGE
        ===================================================== */

        .login-background {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            z-index: 1;

        }


        .login-background img {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

            object-position: center center;

        }


        /* =====================================================
           IMAGE OVERLAY
        ===================================================== */

        .image-overlay {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background: rgba(1, 25, 53, 0.15);

            z-index: 2;

        }


        /* =====================================================
           LOGIN BOX - RIGHT SIDE
        ===================================================== */

        .login-box {

            position: absolute;

            top: 50%;

            right: 10%;

            left: auto;

            transform: translateY(-50%);

            width: 530px;
            height: 600px;

            max-width: 90%;

            padding: 45px 50px;

            background-color: rgba(225, 225, 218, 0.96);

            border: 1px solid #011935;

            border-radius: 15px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);

            z-index: 3;

        }


        /* =====================================================
           LOGIN TITLE
        ===================================================== */

        .login-title {

            text-align: center;

            color: #011935;

            font-size: 44px;

            font-weight: 700;

            margin-bottom: 35px;

        }


        /* =====================================================
           FORM GROUP
        ===================================================== */

        .login-group {

            width: 100%;

            margin-bottom: 25px;

        }


        /* =====================================================
           LABEL
        ===================================================== */

        .login-label {

            display: block;

            color: #011935;

            font-size: 20px;

            font-weight: 600;

            margin-bottom: 10px;

        }


        /* =====================================================
           INPUT
        ===================================================== */

        .login-input {

            width: 100%;

            height: 65px;

            padding: 0 18px;

            background-color: white;

            border: 1px solid #777;

            border-radius: 8px;

            outline: none;

            color: #011935;

            font-family: 'Poppins', sans-serif;

            font-size: 18px;

        }


        .login-input::placeholder {

            color: #777;

            font-size: 17px;

        }


        .login-input:focus {

            border: 2px solid #2c5aa0;

        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-button {

            width: 100%;

            height: 65px;

            margin-top: 5px;

            border: none;

            border-radius: 8px;

            background-color: #011935;

            color: white;

            font-family: 'Poppins', sans-serif;

            font-size: 21px;

            font-weight: 600;

            cursor: pointer;

            transition: background-color 0.3s;

        }


        .login-button:hover {

            background-color: #2c5aa0;

        }


        /* =====================================================
           CREATE ACCOUNT
        ===================================================== */

        .create-account {

            text-align: center;

            margin-top: 24px;

        }


        .create-account p {

            color: #011935;

            font-size: 17px;

            margin-bottom: 7px;

        }


        .create-account a {

            color: #2c5aa0;

            font-size: 18px;

            font-weight: 600;

            text-decoration: none;

        }


        .create-account a:hover {

            color: #011935;

            text-decoration: underline;

        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 1000px) {

            .login-box {

                right: 4%;

                width: 500px;

            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 650px) {

            body {

                overflow: auto;

            }


            .login-header {

                height: 75px;

            }


            .login-header h1 {

                font-size: 28px;

            }


            .login-main {

                height: calc(100vh - 75px);

                min-height: 600px;

            }


            .login-background img {

                object-position: center;

            }


            .login-box {

                width: 92%;

                max-width: 500px;

                right: 50%;

                left: auto;

                transform: translate(50%, -50%);

                padding: 35px 25px;

            }


            .login-title {

                font-size: 34px;

            }


            .login-label {

                font-size: 17px;

            }


            .login-input {

                height: 58px;

                font-size: 16px;

            }


            .login-button {

                height: 58px;

                font-size: 19px;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="login-header">

    <h1>

        StudentHub Portal

    </h1>

</header>


<!-- =====================================================
     MAIN LOGIN AREA
===================================================== -->

<main class="login-main">


    <!-- =================================================
         BACKGROUND IMAGE
    ================================================== -->

    <div class="login-background">

        <img

            src="images/login page.png"

            alt="Indian College Campus">

    </div>


    <!-- =================================================
         IMAGE OVERLAY
    ================================================== -->

    <div class="image-overlay"></div>


    <!-- =================================================
         LOGIN BOX
    ================================================== -->

    <div class="login-box">


        <!-- LOGIN TITLE -->

        <h2 class="login-title">

            🔐 Login

        </h2>


        <!-- LOGIN FORM -->

        <form onsubmit="loginUser(event)">


            <!-- EMAIL / USERNAME -->

            <div class="login-group">

                <label
                    class="login-label"
                    for="username">

                    Email / Username :

                </label>


                <input

                    type="text"

                    id="username"

                    class="login-input"

                    placeholder="Enter Email or Username"

                    required

                    oninvalid="this.setCustomValidity('Please enter your Email or Username')"

                    oninput="this.setCustomValidity('')">

            </div>


            <!-- PASSWORD -->

            <div class="login-group">

                <label
                    class="login-label"
                    for="password">

                    Password :

                </label>


                <input

                    type="password"

                    id="password"

                    class="login-input"

                    placeholder="Enter Password"

                    required

                    oninvalid="this.setCustomValidity('Please enter your Password')"

                    oninput="this.setCustomValidity('')">

            </div>


            <!-- LOGIN BUTTON -->

            <button

                type="submit"

                class="login-button">

                Login

            </button>


        </form>


        <!-- CREATE ACCOUNT -->

        <div class="create-account">

            <p>

                Don't have an account?

            </p>


            <a href="registration.html">

                Create New Account

            </a>

        </div>


    </div>

</main>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

function loginUser(event) {

    event.preventDefault();


    // Get username/email

    var username =
        document.getElementById("username").value;


    // Get password

    var password =
        document.getElementById("password").value;


    // Save login status

    localStorage.setItem("loggedIn", "true");

    localStorage.setItem("user", username);


    // Open Home Page

    window.location.href = "home.html";

}

</script>


</body>

</html>
